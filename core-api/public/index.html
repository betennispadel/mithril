    <script>
      // The saved app theme (ThemeProvider's 'theme' key) before first paint,
      // so the boot splash shows the app's background, not the OS scheme's.
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          var dark =
            theme === 'dark' ||
            (theme !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (e) {
          // storage blocked: the splash stays light until the app starts
        }
      })();
